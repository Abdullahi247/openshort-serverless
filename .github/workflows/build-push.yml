name: Build and push Runpod image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (e.g. v1, v1.1)"
        required: true
        default: "v2"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "scripts/**"
      - ".github/workflows/build-push.yml"
      - ".dockerignore"

concurrency:
  group: build-push-openshorts-runpod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout openshorts-runpod
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "==> Disk before cleanup"
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          echo "==> Disk after cleanup"
          df -h

      - name: Clone OpenShorts source
        run: |
          git clone --depth 1 https://github.com/mutonby/openshorts.git "$RUNNER_TEMP/openshorts"
          test -f "$RUNNER_TEMP/openshorts/requirements.txt"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync, build, and push
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'v2' }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh docker/entrypoint.sh
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/openshorts-runpod:${IMAGE_TAG}"
          echo "==> Target image: $IMAGE"
          ./scripts/build.sh "$RUNNER_TEMP/openshorts" "$IMAGE" --push

      - name: Summary
        if: success()
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'v2' }}
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '\`${{ secrets.DOCKERHUB_USERNAME }}/openshorts-runpod:'"${IMAGE_TAG}"'\`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on Runpod → Serverless → Load Balancer → this image, port 80, health /ping" >> "$GITHUB_STEP_SUMMARY"
